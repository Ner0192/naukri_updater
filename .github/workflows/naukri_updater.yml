name: Naukri Profile Auto-Updater

on:
  workflow_dispatch: # Allows you to trigger the script manually from the Actions tab
  schedule:
    # Runs automatically every day at 02:00 AM UTC (07:30 AM IST). 
    - cron: '0 2 * * *'

jobs:
  update-profile:
    runs-on: ubuntu-latest
    
    # This tells GitHub to pull secrets specifically from the 'prod' environment
    environment: prod 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Run Naukri Updater Script
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        run: python naukri_updater.py